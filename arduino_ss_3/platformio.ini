; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Environnement par défaut (build + IntelliSense) : ESP32
[platformio]
default_envs = esp32

; Carte Arduino Uno : pas de LittleFS ni de millis()/File ESP32 -> elog.cpp exclu
; eLogic.cpp est la logique ESP32 (HardwareSerial(2), modules "e") -> exclu aussi
[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<*> -<elog.cpp> -<eLogic.cpp>

; Carte ESP32 : seule cible où eLog (LittleFS) peut compiler
; Adapter "board" à votre carte exacte si ce n'est pas un esp32dev.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
